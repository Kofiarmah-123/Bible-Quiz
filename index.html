<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Start Screen -->
    <div id="start-screen">
        <h1>Bible Quiz</h1>

        <input
            type="text"
            id="Name"
            placeholder="Enter Your Name"
        >

        <button id="startBtn">Start Test</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hide">

        <div class="top-bar">

            <h3 id="progress">
                Question 1 of 10
            </h3>

            <h3 id="timer">
                10:00
            </h3>

        </div>

        <h2 id="question"></h2>

        <div id="answers">

            <!-- Answers will appear here -->

        </div>

        <button id="nextBtn">
            Next
        </button>

    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hide">

        <h1>Test Completed</h1>

        <h2 id="Result"></h2>

        <h2 id="score"></h2>

        <h2 id="percentage"></h2>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
